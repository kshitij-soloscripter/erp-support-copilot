[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-support-copilot"
version = "0.1.0"
description = "Local, evidence-backed ERP support with hybrid retrieval and Qwen models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gradio>=5.49,<6", "langchain-core>=1,<2", "langchain-text-splitters>=1,<2",
  "qdrant-client>=1.15,<2", "sentence-transformers>=5,<6", "transformers>=4.57,<5",
  "rank-bm25>=0.2.2,<0.3", "pydantic-settings>=2,<3", "httpx>=0.28,<0.29",
  "huggingface-hub>=0.34,<1", "accelerate>=1,<2", "pyyaml>=6,<7", "certifi"
]
[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]
[project.scripts]
erp-copilot = "erp_copilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
